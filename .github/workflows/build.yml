---
name: build
# Publishes the image after merge: daily, on pushes to main, and on release
# tags (§spec:image-channels). Nothing here gates a merge; the pull request
# build runs in quality.yml from the same image.yml (§spec:quality-publish-split).
on:
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.github/**'
      - 'disk_config/**'
      - 'cosign.*'
      - '.flywheel.yml'
      - 'version.txt'
      - 'artifacthub-repo.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      publish: true
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
