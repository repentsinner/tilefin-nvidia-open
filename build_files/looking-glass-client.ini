; System-wide Looking Glass client defaults (§spec:looking-glass-client).
; ~/.config/looking-glass/client.ini overrides any of these per user.
[input]
; Tap to release keyboard and mouse capture; hold with Q to quit, F for
; fullscreen. The client swallows this key and every key pressed while it is
; held, so it cannot be a modifier the guest needs. The upstream default,
; Scroll Lock, is missing from many keyboards.
escapeKey=KEY_RIGHTCTRL
